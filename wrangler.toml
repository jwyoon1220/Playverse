name = "playverse"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/images/*"]

[[d1_databases]]
binding = "DB"
database_name = "playverse-db"
database_id = "6ce8ee4e-0932-4a4f-9f56-997a6499eaf8"

